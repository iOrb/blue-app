name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/web-preview.md", "scripts/web-*.mjs"]
  pull_request:
    paths-ignore: ["web/**", "docs/web-preview.md", "scripts/web-*.mjs"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check localization and script syntax
        run: |
          python3 scripts/check-localization.py
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh ci_scripts/*.sh; do bash -n "$script"; done
      # Native builds, tests and signing run in Xcode Cloud, not an
      # unavailable private GitHub runner or a second signing pipeline.
