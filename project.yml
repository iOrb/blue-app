name: Blue
options:
  bundleIdPrefix: app.iorb
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: en
  knownRegions: [en, es, Base]
configs:
  Debug: debug
  Release: release
  Cloud: debug
settings:
  configs:
    Cloud:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG CLOUD_VERIFICATION"
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    DEVELOPMENT_TEAM: Z33UY64QQA
targets:
  Blue:
    type: application
    platform: iOS
    sources:
      - path: Blue
        excludes: [Resources/Info.plist]
    info:
      path: Blue/Resources/Info.plist
      properties:
        GIDClientID: 986940080652-n0h197enieffheihatctvnva4n19vs20.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: Google OAuth
            CFBundleURLSchemes: [com.googleusercontent.apps.986940080652-n0h197enieffheihatctvnva4n19vs20]
        CFBundleDisplayName: Blue
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAlarmKitUsageDescription: Blue schedules the alarms you create, even when your iPhone is locked.
        NSMicrophoneUsageDescription: Blue uses the microphone for voice conversations and dictation you start.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iorb.blue.ios
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BlueTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BlueTests]
    dependencies:
      - target: Blue
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BlueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BlueUITests]
    dependencies:
      - target: Blue
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Blue:
    build:
      targets:
        Blue: all
    test:
      targets: [BlueTests, BlueUITests]
      gatherCoverageData: true
    profile:
      config: Release
    archive:
      config: Release
  BlueCloud:
    build:
      targets:
        Blue: all
    test:
      config: Cloud
      targets: [BlueTests]
      gatherCoverageData: true
    archive:
      config: Release
